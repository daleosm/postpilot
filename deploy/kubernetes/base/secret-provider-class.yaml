apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postpilot-application-secrets
  namespace: postpilot
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider: aws
  secretObjects:
    - secretName: postpilot-secrets
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: POSTPILOT_SESSION_SECRET
          key: POSTPILOT_SESSION_SECRET
        - objectName: POSTPILOT_FRONTEND_ORIGINS
          key: POSTPILOT_FRONTEND_ORIGINS
        - objectName: POSTPILOT_DEBUG_DEMO
          key: POSTPILOT_DEBUG_DEMO
  parameters:
    region: eu-west-1
    usePodIdentity: "true"
    objects: |
      - objectName: "postpilot/application"
        objectType: "secretsmanager"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          # `||` permits a zero-downtime migration from the original
          # NEXTAUTH_* JSON keys to the FastAPI-native keys. The mounted and
          # Kubernetes-secret names are always POSTPILOT_*.
          - path: "POSTPILOT_SESSION_SECRET || NEXTAUTH_SECRET"
            objectAlias: POSTPILOT_SESSION_SECRET
          - path: "POSTPILOT_FRONTEND_ORIGINS || NEXTAUTH_URL"
            objectAlias: POSTPILOT_FRONTEND_ORIGINS
          - path: POSTPILOT_DEBUG_DEMO
            objectAlias: POSTPILOT_DEBUG_DEMO
