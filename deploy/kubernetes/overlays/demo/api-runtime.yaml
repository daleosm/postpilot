apiVersion: apps/v1
kind: Deployment
metadata:
  name: postpilot-api
  namespace: postpilot
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Keep the current public demo HTTP-compatible. Debug sessions are
            # still disabled because the API always runs in production mode.
            - name: POSTPILOT_ENVIRONMENT
              value: production
            - name: POSTPILOT_COOKIE_SECURE
              value: "false"
