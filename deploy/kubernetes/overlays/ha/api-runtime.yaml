apiVersion: apps/v1
kind: Deployment
metadata:
  name: postpilot-api
  namespace: postpilot
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: POSTPILOT_ENVIRONMENT
              value: production
            - name: POSTPILOT_COOKIE_SECURE
              value: "true"
