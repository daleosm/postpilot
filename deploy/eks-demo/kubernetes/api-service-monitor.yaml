apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postpilot-api
  namespace: postpilot
  labels:
    # Matches the pinned kube-prometheus-stack release in this Terraform root.
    release: postpilot-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postpilot-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
