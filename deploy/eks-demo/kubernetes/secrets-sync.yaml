apiVersion: apps/v1
kind: Deployment
metadata:
  name: postpilot-secrets-sync
  namespace: postpilot
  annotations:
    # This must become Available before the migration hook runs. The mounted
    # Secrets Store CSI volume creates and keeps postpilot-secrets in sync.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: secrets-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/component: secrets-sync
    spec:
      serviceAccountName: postpilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: public.ecr.aws/docker/library/busybox:1.36.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -s /mnt/secrets-store/DATABASE_URL"]
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: postpilot-application-secrets
