apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postpilot-api
  namespace: postpilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postpilot-api
  minReplicas: 2
  # The compact two-worker demo has deliberate fixed capacity. Keep the API
  # available across both workers without creating extra Pods.
  maxReplicas: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
