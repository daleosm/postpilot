name: PostPilot CI

on:
  pull_request:
  push:
    branches: [main]
    # The deployment workflow writes only immutable GitOps image references.
    # Argo CD reconciles those commits; they do not need another CI run.
    paths-ignore:
      - deploy/eks-demo/kubernetes/deployment.yaml
      - deploy/eks-demo/kubernetes/api-deployment.yaml
      - deploy/eks-demo/kubernetes/api-migration-job.yaml
      - deploy/eks-demo/kubernetes/demo-seed.yaml
      - deploy/eks-ha/kubernetes/deployment.yaml
      - deploy/eks-ha/kubernetes/api-deployment.yaml
      - deploy/eks-ha/kubernetes/api-migration-job.yaml
  workflow_dispatch:

# Jobs elevate only the permissions they require.
permissions:
  contents: read

# A new revision supersedes an older validation run. Deployments are handled by
# a separate workflow and are never cancelled by this group.
concurrency:
  group: postpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test:client

  backend:
    name: FastAPI PostgreSQL suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postpilot
          POSTGRES_USER: postpilot
          POSTGRES_PASSWORD: postpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpilot -d postpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install locked backend tooling and dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Lint, migrate, seed, and test FastAPI
        working-directory: backend
        env:
          POSTPILOT_DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
          POSTPILOT_RUN_DB_TESTS: "true"
        run: |
          ruff format --check .
          ruff check .
          alembic upgrade head
          python -m app.demo_seed
          pytest

  security:
    name: Dependency, secret, and Terraform security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan source, dependencies, and secrets with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,.next,.next-playwright,test-results
      - uses: hashicorp/setup-terraform@v3
      - name: Check and validate Terraform roots
        run: |
          terraform fmt -check -recursive deploy/eks-demo/terraform
          terraform fmt -check -recursive deploy/eks-ha/terraform
          for root in deploy/eks-demo/terraform deploy/eks-ha/terraform; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done
      - name: Scan Terraform policy with Checkov
        run: |
          for root in deploy/eks-demo/terraform deploy/eks-ha/terraform; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              bridgecrew/checkov@sha256:c64ffb6d6fc8087c896341a2c697770a04a1cf558db04fa7b8129d8ca6bce336 \
              -d "/repo/$root" \
              --framework terraform \
              --compact \
              --quiet \
              --config-file "/repo/$root/.checkov.yaml" \
              --var-file "/repo/$root/terraform.tfvars.example"
          done

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  browser:
    name: Playwright Chromium journeys
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postpilot
          POSTGRES_USER: postpilot
          POSTGRES_PASSWORD: postpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpilot -d postpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Install backend test runtime
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Migrate and seed isolated browser-test data
        working-directory: backend
        env:
          POSTPILOT_DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
        run: |
          alembic upgrade head
          python -m app.demo_seed
      - name: Start FastAPI browser runtime
        working-directory: backend
        env:
          POSTPILOT_DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
          POSTPILOT_DEBUG_DEMO: "true"
          POSTPILOT_FRONTEND_ORIGINS: http://localhost:5001,http://localhost:5002
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/postpilot-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/postpilot-api.pid"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/postpilot-api.log"
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run complete Chromium browser suite
        env:
          DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_API_ORIGIN: http://127.0.0.1:8000
          POSTPILOT_API_INTERNAL_URL: http://127.0.0.1:8000
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
        run: pnpm test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            ${{ runner.temp }}/postpilot-api.log
          if-no-files-found: warn
          retention-days: 14

  passive_dast:
    name: Passive DAST on disposable production runtime
    needs: [frontend, backend, browser, security, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postpilot
          POSTGRES_USER: postpilot
          POSTGRES_PASSWORD: postpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpilot -d postpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Install and seed API runtime
        working-directory: backend
        env:
          POSTPILOT_DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
        run: |
          python -m pip install -e .
          alembic upgrade head
          python -m app.demo_seed
          POSTPILOT_FRONTEND_ORIGINS=http://localhost:5003 python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/postpilot-dast-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/postpilot-dast-api.log"
          exit 1
      - name: Build and start disposable production frontend
        env:
          POSTPILOT_API_ORIGIN: http://127.0.0.1:8000
          POSTPILOT_API_INTERNAL_URL: http://127.0.0.1:8000
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
        run: |
          pnpm build
          pnpm exec next start --port 5003 > "$RUNNER_TEMP/postpilot-dast-ui.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5003/sign-in > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/postpilot-dast-api.log"
          cat "$RUNNER_TEMP/postpilot-dast-ui.log"
          exit 1
      - name: Run OWASP ZAP passive public-surface baseline
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          # The pinned ZAP image runs as its unprivileged `zap` user, while
          # GitHub creates RUNNER_TEMP as the runner user.
          chmod 777 "$RUNNER_TEMP/zap"
          docker run --rm --network host \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-baseline.py -t http://127.0.0.1:5003/sign-in -m 1 -I -J zap-frontend-report.json -r zap-frontend-report.html
      - name: Run OWASP ZAP safe OpenAPI scan
        run: |
          docker run --rm --network host \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-api-scan.py -t http://127.0.0.1:8000/openapi.json -S -I -J zap-api-report.json -r zap-api-report.html
      - name: Enforce reviewed passive DAST policy
        run: |
          python scripts/security/check_zap_report.py \
            --policy .github/zap/alert-policy.json \
            "$RUNNER_TEMP/zap/zap-frontend-report.json" \
            "$RUNNER_TEMP/zap/zap-api-report.json"
      - name: Upload passive DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-passive-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zap/
            ${{ runner.temp }}/postpilot-dast-api.log
            ${{ runner.temp }}/postpilot-dast-ui.log
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and scan verified runtime images
    needs: [frontend, backend, browser, security, sast, passive_dast]
    if: >-
      always() &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.browser.result == 'success' &&
      needs.security.result == 'success' &&
      needs.sast.result == 'success' &&
      (needs.passive_dast.result == 'success' || needs.passive_dast.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: postpilot-ui:ci-${{ github.sha }}
      - name: Build FastAPI runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          load: true
          push: false
          tags: postpilot-api:ci-${{ github.sha }}
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: postpilot-ui:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan FastAPI runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: postpilot-api:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
