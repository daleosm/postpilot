name: Test and deploy PostPilot

on:
  pull_request:
  push:
    branches: [main]
    # The publish job writes only these immutable image references. Argo CD
    # reconciles that GitOps commit, so it does not need another test/build run.
    paths-ignore:
      - deploy/eks-demo/kubernetes/deployment.yaml
      - deploy/eks-demo/kubernetes/api-deployment.yaml
      - deploy/eks-demo/kubernetes/api-migration-job.yaml
      - deploy/eks-demo/kubernetes/demo-seed.yaml
      - deploy/eks-ha/kubernetes/deployment.yaml
      - deploy/eks-ha/kubernetes/api-deployment.yaml
      - deploy/eks-ha/kubernetes/api-migration-job.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postpilot-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a production deploy that has already passed its test gate.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    name: Security and infrastructure gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan source, dependencies, and secrets with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,.next,.next-playwright,test-results
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive deploy/eks-demo/terraform
          terraform fmt -check -recursive deploy/eks-ha/terraform
      - name: Validate EKS Terraform roots
        run: |
          terraform -chdir=deploy/eks-demo/terraform init -backend=false
          terraform -chdir=deploy/eks-demo/terraform validate
          terraform -chdir=deploy/eks-ha/terraform init -backend=false
          terraform -chdir=deploy/eks-ha/terraform validate
      - name: Scan Terraform policy with Checkov
        run: |
          for root in deploy/eks-demo/terraform deploy/eks-ha/terraform; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              bridgecrew/checkov@sha256:c64ffb6d6fc8087c896341a2c697770a04a1cf558db04fa7b8129d8ca6bce336 \
              -d "/repo/$root" \
              --framework terraform \
              --compact \
              --quiet \
              --config-file "/repo/$root/.checkov.yaml" \
              --var-file "/repo/$root/terraform.tfvars.example"
          done

  validate:
    name: App test suite
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postpilot
          POSTGRES_USER: postpilot
          POSTGRES_PASSWORD: postpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpilot -d postpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postpilot:postpilot@localhost:5432/postpilot
      POSTPILOT_DEBUG_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # FastAPI pytest is the authoritative server-side suite. It runs against
      # the migrated PostgreSQL service before any browser journey starts.
      - name: Validate FastAPI backend (authoritative PostgreSQL suite)
        working-directory: backend
        env:
          POSTPILOT_DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
          POSTPILOT_RUN_DB_TESTS: "true"
        run: |
          python -m pip install -e '.[dev]'
          ruff format --check .
          ruff check .
          alembic upgrade head
          python -m app.demo_seed
          pytest
      # Keep browser journeys on the same runtime boundary as deployment:
      # Next serves UI/RSC while browser API requests use FastAPI directly.
      # This prevents the frontend from masking a missing Python endpoint or
      # session/tenant regression.
      - name: Start FastAPI for browser journeys
        working-directory: backend
        env:
          POSTPILOT_DATABASE_URL: postgresql://postpilot:postpilot@localhost:5432/postpilot
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
          POSTPILOT_DEBUG_DEMO: "true"
          POSTPILOT_FRONTEND_ORIGINS: http://localhost:5001,http://localhost:5002
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/postpilot-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/postpilot-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/postpilot-api.log"
          exit 1
      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright browser journeys
        env:
          POSTPILOT_API_ORIGIN: http://127.0.0.1:8000
          POSTPILOT_API_INTERNAL_URL: http://127.0.0.1:8000
          POSTPILOT_SESSION_SECRET: postpilot-ci-auth-secret-which-is-long-enough
        run: pnpm test:all
      - name: Print FastAPI browser-runtime log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/postpilot-api.log"

  publish:
    name: Build, scan, and deploy
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve the ECR repository name
        id: image
        run: |
          echo "name=${{ vars.ECR_REPOSITORY_URL }}" >> "$GITHUB_OUTPUT"
          # ECR tags are immutable. The run ID makes a retry or a separately
          # dispatched build of the same commit publishable without replacing
          # an existing image, while retaining the commit SHA for traceability.
          echo "tag=${GITHUB_SHA}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
        with:
          mask-password: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:api-${{ steps.image.outputs.tag }}
      - name: Scan the published runtime image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the published FastAPI image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:api-${{ steps.image.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: migrations
          push: true
          tags: ${{ steps.image.outputs.name }}:api-migrations-${{ steps.image.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: seed
          push: true
          tags: ${{ steps.image.outputs.name }}:api-seed-${{ steps.image.outputs.tag }}
      - name: Commit the immutable image references for Argo CD
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          # Replace the value of each image field, whether it is still the
          # local placeholder or an immutable ECR reference from a prior run.
          for manifest in deploy/eks-demo/kubernetes/deployment.yaml deploy/eks-ha/kubernetes/deployment.yaml; do
            sed -i -E "s|^([[:space:]]*image:)[[:space:]]+[^[:space:]]+|\\1 ${IMAGE}:${IMAGE_TAG}|" "$manifest"
          done
          for manifest in deploy/eks-demo/kubernetes/api-deployment.yaml deploy/eks-ha/kubernetes/api-deployment.yaml; do
            sed -i -E "s|^([[:space:]]*image:)[[:space:]]+[^[:space:]]+|\\1 ${IMAGE}:api-${IMAGE_TAG}|" "$manifest"
          done
          for manifest in deploy/eks-demo/kubernetes/api-migration-job.yaml deploy/eks-ha/kubernetes/api-migration-job.yaml; do
            sed -i -E "s|^([[:space:]]*image:)[[:space:]]+[^[:space:]]+|\\1 ${IMAGE}:api-migrations-${IMAGE_TAG}|" "$manifest"
          done
          sed -i -E "s|^([[:space:]]*image:)[[:space:]]+[^[:space:]]+|\\1 ${IMAGE}:api-seed-${IMAGE_TAG}|" deploy/eks-demo/kubernetes/demo-seed.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/eks-demo/kubernetes/deployment.yaml deploy/eks-demo/kubernetes/api-deployment.yaml deploy/eks-demo/kubernetes/api-migration-job.yaml deploy/eks-demo/kubernetes/demo-seed.yaml deploy/eks-ha/kubernetes/deployment.yaml deploy/eks-ha/kubernetes/api-deployment.yaml deploy/eks-ha/kubernetes/api-migration-job.yaml
          git diff --cached --quiet || git commit -m "chore(deploy): postpilot ${IMAGE_TAG}"
          git push
